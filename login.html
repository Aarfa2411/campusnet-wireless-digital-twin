<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to CampusNet Smart Campus Wireless Digital Twin Management System">
  <title>Login | CampusNet Digital Twin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <circle cx="12" cy="20" r="1.5" fill="currentColor"></circle>
        </svg>
      </div>
      <div>
        <h1 class="login-brand-title">CampusNet Digital Twin</h1>
        <p class="login-brand-subtitle">Smart Campus Wireless Network Management</p>
      </div>
    </div>

    <!-- Simulation Mode Notice -->
    <div class="disclosure-banner" style="margin: 0; font-size: 0.75rem;">
      <span class="disclosure-badge">DEMO</span>
      <span><strong>Educational Prototype:</strong> Simulation data only. No connection to live routers.</span>
    </div>

    <!-- Error Alert Box -->
    <div id="login-error-alert" class="login-error-alert" role="alert"></div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="login-email" class="form-label">Email Address</label>
        <input type="email" id="login-email" class="form-input" placeholder="admin@campus.edu" required autocomplete="username">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label for="login-password" class="form-label">Password</label>
          <button type="button" id="btn-toggle-password" style="background:none; border:none; color:var(--color-primary); font-size:0.75rem; cursor:pointer; font-weight:600;">Show</button>
        </div>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; font-size: 0.8rem;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text-secondary);">
          <input type="checkbox" id="remember-me" checked> Remember session
        </label>
      </div>

      <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 10px;">
        Sign In to Management Console
      </button>
    </form>

    <!-- Documented Demo Credentials Box -->
    <div class="demo-credentials-box">
      <div class="demo-box-header">
        <span>Click to Auto-fill Demo Credentials</span>
        <span>Client-side Demo</span>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button type="button" class="demo-pill-btn" id="btn-fill-admin">
          <span class="demo-role-tag">Administrator</span>
          <span class="demo-cred-text">admin@campus.edu</span>
          <span class="demo-cred-text">Pass: admin123</span>
        </button>
        <button type="button" class="demo-pill-btn" id="btn-fill-operator">
          <span class="demo-role-tag">Network Operator</span>
          <span class="demo-cred-text">operator@campus.edu</span>
          <span class="demo-cred-text">Pass: operator123</span>
        </button>
      </div>
    </div>
  </div>

  <script src="shared-state.js"></script>
  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to dashboard
      const existingUser = DemoAuth.getCurrentUser();
      if (existingUser) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const rememberInput = document.getElementById('remember-me');
      const errorAlert = document.getElementById('login-error-alert');
      const togglePassBtn = document.getElementById('btn-toggle-password');

      // Demo autofill buttons
      document.getElementById('btn-fill-admin').addEventListener('click', () => {
        emailInput.value = 'admin@campus.edu';
        passwordInput.value = 'admin123';
        errorAlert.style.display = 'none';
      });

      document.getElementById('btn-fill-operator').addEventListener('click', () => {
        emailInput.value = 'operator@campus.edu';
        passwordInput.value = 'operator123';
        errorAlert.style.display = 'none';
      });

      // Show/Hide password toggle
      togglePassBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          togglePassBtn.textContent = 'Hide';
        } else {
          passwordInput.type = 'password';
          togglePassBtn.textContent = 'Show';
        }
      });

      // Submit handler
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';

        const result = DemoAuth.login(emailInput.value, passwordInput.value, rememberInput.checked);
        if (result.success) {
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || 'dashboard.html';
          window.location.href = redirect;
        } else {
          errorAlert.textContent = result.message;
          errorAlert.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
